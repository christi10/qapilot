name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cargo build --release
      - name: Engine tests
        run: cargo test --release
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Runner tests
        run: node --test 'test/*.test.mjs'
